name = "context"
version = "0.1.0"
kinds = ["hook"]
description = "上下文太長時自動摘要舊訊息，全文留在資料庫，之後的回合不再重送"
enabled = true

[settings.window]
in_settings = "compress"
type = "number"
default = 0
label = "壓縮用的上下文大小（token）。0＝照模型本身的上下文窗口；填 100000 就當作只有 10 萬"

[settings.trigger]
in_settings = "compress"
type = "number"
default = 70
label = "用量超過上下文窗口的百分之幾就壓縮：回合結束後在背景先做，不用等；回合進行中超過也會先壓縮"

[settings.tail_tokens]
in_settings = "compress"
type = "number"
default = 10000
label = "壓縮後原樣保留最近多少 token 的訊息（照模型實際算法校正過，最多上下文的 25%）；至少留最後一步，不拆開工具呼叫和結果"

[settings.summary_tokens]
in_settings = "compress"
type = "number"
default = 8000
label = "摘要最多幾 token（最多上下文的 10%）。再壓縮時只改有變的行，超過上限才刪掉最舊、最不需要的細節"

[settings.quote_count]
in_settings = "compress"
type = "number"
default = 3
label = "摘要後面附上你最近幾則原話（0＝不附）；更早的寫進摘要，原文用 session_search 查得到"

[settings.quote_tokens]
in_settings = "compress"
type = "number"
default = 1500
label = "附的原話合計最多幾 token"

[settings.ratio]
in_settings = "compress"
type = "number"
default = 20
label = "第一次寫摘要時，長度佔原文的百分之幾（壓縮幅度，建議 10 到 30）；不超過摘要上限"

[settings.method]
in_settings = "compress"
type = "select"
default = "單次"
options = ["單次", "多工"]
label = "壓縮方式：單次＝一次摘要（預設）；多工＝依字數分段同時摘要，最後合併"

[settings.parallel]
in_settings = "compress"
type = "number"
default = 4
label = "多工時，一次同時跑幾段（1 到 8）"

[settings.keep_images]
in_settings = "compress"
type = "number"
default = 1
label = "壓縮後工具附的圖保留最近幾張（0 到 50），更早的不再送給模型（檔案都還在，要看可以再開）"


[settings.mid_turn]
type = "boolean"
default = true
label = "回合進行中也壓縮：工具結果一直疊上去、用量超過門檻時先壓縮再送；模型回報上下文爆掉時壓縮後重送。使用者這次的要求會在摘要後面原文重述，模型接著做完"
