name = "context"
version = "0.1.0"
kinds = ["hook"]
description = "上下文太長時自動摘要舊訊息，全文留在資料庫，之後的回合不再重送"
enabled = true

[settings.window]
in_settings = "compress"
type = "number"
default = 0
label = "壓縮用的上下文大小（token）。0＝照模型本身的上下文窗口；填 100000 就當作只有 10 萬"

[settings.trigger]
in_settings = "compress"
type = "number"
default = 70
label = "用量超過上下文窗口的百分之幾就在背景壓縮：回合結束後、回合進行中都一樣，對話照常進行，寫好後下一次送出開始用"

[settings.wait_at]
in_settings = "compress"
type = "number"
default = 90
label = "用量到上下文窗口的百分之幾時，背景的摘要還沒寫好就停下來等它（或當場壓縮）。比壓縮門檻低或一樣＝每次都等"

[settings.tail_tokens]
in_settings = "compress"
type = "number"
default = 10000
label = "壓縮後原樣保留最近多少 token 的訊息（照模型實際算法校正過，最多上下文的 25%）；至少留最後一步，不拆開工具呼叫和結果"

[settings.summary_tokens]
in_settings = "compress"
type = "number"
default = 8000
label = "摘要最多幾 token，第一次寫和之後更新都照這個。再壓縮時只改有變的行，超過上限才刪掉最舊、最不需要的細節；摘要加原樣保留超過上下文一半時，這次才自動壓低並通知"

[settings.quote_count]
in_settings = "compress"
type = "number"
default = 3
label = "摘要後面附上你最近幾則原話（0＝不附）；更早的寫進摘要，原文用 session_search 查得到"

[settings.quote_tokens]
in_settings = "compress"
type = "number"
default = 1500
label = "附的原話合計最多幾 token"

[settings.recap_chars]
in_settings = "compress"
type = "number"
default = 1000
label = "摘要裡「回顧」最多幾字（200 到 10000）：較早做過的事一行一件（要什麼 → 結果），超過時合併最舊的幾行"

[settings.quote_each_chars]
in_settings = "compress"
type = "number"
default = 750
label = "單則原話最多幾字（100 到 20000），超過只附開頭和結尾（例如直接貼文件），註明用 session_search 查全文"

[settings.quote_reply_chars]
in_settings = "compress"
type = "number"
default = 250
label = "每則原話前面附它回應的助手那則開頭幾字（0＝不附）；先講結論的回覆，開頭就看得出你回的是什麼"

[settings.keep_images]
in_settings = "compress"
type = "number"
default = 1
label = "壓縮後工具附的圖保留最近幾張（0 到 50），更早的不再送給模型（檔案都還在，要看可以再開）"


[settings.mid_turn]
type = "boolean"
default = true
label = "回合進行中也壓縮：工具結果一直疊上去、用量超過門檻時先壓縮再送；模型回報上下文爆掉時壓縮後重送。使用者這次的要求會在摘要後面原文重述，模型接著做完"
