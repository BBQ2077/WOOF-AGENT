name = "skills"
version = "0.3.0"
kinds = ["tool", "hook"]
description = "Skills：skill 清單放進系統提示，skill_view 載入全文、skill_write 建立或覆寫。讀寫就是這兩個工具的開關；資料夾和要勾哪些 skill 在「設定 → Skills」"
enabled = true

[settings.dirs]
in_settings = "skills"
type = "text"
default = ""
label = "讀取的 Skills 資料夾（多個用 ; 分隔；留空＝只用 WOOF 自己的 data/skills）"

[settings.write_dir]
in_settings = "skills"
type = "text"
default = "data/skills"
label = "寫入位置（相對 WOOF 資料夾；只能寫到這裡，不碰別的 skills）"

[settings.enabled_skills]
in_settings = "skills"
type = "text"
default = ""
label = "已勾選的 skill（由 Skills 分區管理，逗號分隔）"
