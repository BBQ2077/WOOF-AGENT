name = "focus"
version = "1.0.0"
kinds = ["hook"]
description = "重點便條（預設關）：上下文壓縮把待辦／權限／出錯摘要掉之後，於下一次請求尾端補一小段狀態。會讓部分模型把同一件事重想一遍，長任務出現原地打轉時保持關閉"
enabled = false

[settings.from_step]
type = "number"
default = 2
label = "從這一回合的第幾步開始附（第 0 步是使用者剛送出的那次）。沒剛壓縮過的那一步不會貼"

[settings.max_tokens]
type = "number"
default = 300
label = "便條上限（tokens，估計值）。這是上限，沒東西可寫時會更短或不附"
