name = "web_search"
version = "0.1.0"
kinds = ["tool"]
description = "網路搜尋與網頁擷取：先用 Firecrawl、Tavily 的免 key 端點，限流再換要扣點數的 key（多把輪換，用完自動跳下一把）"
enabled = true

[settings.order]
type = "order"
options = ["firecrawl", "tavily", "firecrawl_keyless", "tavily_keyless"]
default = "firecrawl_keyless,tavily_keyless,firecrawl,tavily"
label = "搜尋順序（用逗號分隔，限流或額度用完才換下一家）"

[settings.firecrawl_billing_day]
type = "number"
default = 1
label = "Firecrawl 每月重置日（1–31，超過當月天數取月底）"

[settings.tavily_billing_day]
type = "number"
default = 1
label = "Tavily 每月重置日（1–31，超過當月天數取月底）"

[settings.results]
type = "number"
default = 5
label = "搜尋結果數量（1–10）"

[settings.snippet_chars]
type = "number"
default = 200
label = "搜尋結果每筆附幾字摘錄"

[settings.total_chars]
type = "number"
default = 10000
label = "擷取網頁：一次讀好幾頁時，全部預覽合計最多幾字（平均分給每頁，每頁至少 1500、最多照下面的字數）"

[settings.preview_chars]
type = "number"
default = 4000
label = "擷取網頁：清掉雜訊後不到這個字數就直接給全文，超過才給預覽（只讀一頁時；讀好幾頁時照合計上限平分）"

[settings.hit_chars]
type = "number"
default = 3000
label = "擷取網頁的預覽：關鍵字命中段落（含前後文）最多幾字"

[settings.lead_chars]
type = "number"
default = 500
label = "擷取網頁的預覽：開頭給幾字（沒有給關鍵字時再加上命中段落的字數）"

[settings.outline_chars]
type = "number"
default = 600
label = "擷取網頁的預覽：標題目錄最多幾字（太長時只列上兩層）"
