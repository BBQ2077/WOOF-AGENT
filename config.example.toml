# WOOF 設定範例：複製成 config.toml 再改。金鑰放 keys.toml（格式見 keys.example.toml），不要寫在這裡。

# 工作目錄：terminal 與檔案工具的預設位置（不填＝使用者資料夾下的 WOOF-files）
# workdir = "D:/work"
# 介面可以直接預覽的資料夾
# allowed_dirs = ["D:/work"]

# ── OpenAI 相容 API（OpenRouter、DeepSeek、xAI、NVIDIA NIM、Ollama 等都用這種寫法）──
[[models]]
id = "openrouter-example"
label = "範例模型（OpenRouter）"
provider = "openai_compat"
model = "vendor/model-name"
base_url = "https://openrouter.ai/api/v1"
key_pool = "openrouter"
effort_style = "openrouter"
efforts = ["low", "medium", "high"]
default_effort = "medium"
vision = true
context_window = 200000

# 免費或常被限流的模型：多重試幾次、限流時等久一點
[[models]]
id = "free-example"
label = "免費模型範例"
provider = "openai_compat"
model = "vendor/model-name:free"
base_url = "https://openrouter.ai/api/v1"
key_pool = "openrouter"
effort_style = "none"
max_retries = 2
rate_limit_wait = 120
vision = false
context_window = 131072

# 本機 Ollama（不需要金鑰）
[[models]]
id = "ollama-local"
label = "本機模型（Ollama）"
provider = "openai_compat"
model = "llama3.3"
base_url = "http://127.0.0.1:11434/v1"
effort_style = "none"
vision = false
context_window = 131072

# ── Anthropic API（用 API key）──
[[models]]
id = "claude-api"
label = "Claude（API key）"
provider = "anthropic"
model = "claude-sonnet-model-id"
key_pool = "anthropic"
efforts = ["low", "medium", "high"]
default_effort = "medium"
vision = true
context_window = 200000

# ── 本機 claude CLI（用你自己已登入的 claude 指令）──
[[models]]
id = "claude-cli"
label = "Claude（本機 CLI）"
provider = "claude_cli"
model = "sonnet"
efforts = ["low", "medium", "high"]
default_effort = "medium"
vision = true
context_window = 200000

# ── 權限 ──
[permissions]
# 新對話的預設權限：auto（全自動）/ edits（改檔自動）/ ask（先問我）/ readonly（唯讀）/ custom（自訂）
default_mode = "ask"
# 會自動執行的模式裡，危險指令（rm -rf、git push --force…）改成先問
danger_ask = true
# 排程等沒人在旁邊的對話，碰到要先問的工具：deny（擋下）/ approve（直接放行）
headless = "deny"
# 模型用提問卡片問你時，等幾秒沒回就自動略過並告訴它你可能不在（0＝一直等）
ask_timeout = 180


# ── 對外連線 ──
# 預設只聽本機（127.0.0.1，埠號隨機），不用改這一節。要讓別台電腦連進來才需要：
# 先 python -m woof set-password 設密碼，再把 bind 改掉。做法見 README「在另一台電腦跑」。
[server]
# local（只聽本機）/ lan（區網）/ public（外網）
bind = "local"
# 登入密碼的雜湊，執行 python -m woof set-password 產生（這裡不要寫明文密碼）
# password_hash = "pbkdf2_sha256$..."
# 登入後拿到的憑證可以用幾天
# session_days = 30
# public 一定要 HTTPS：填憑證檔，或放在反向代理後面
# https_cert = "C:/certs/fullchain.pem"
# https_key = "C:/certs/privkey.pem"
# 前面有 nginx、Caddy 之類的反向代理在處理 HTTPS 時設 true
# trust_proxy = false
